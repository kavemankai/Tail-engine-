name: Verify and package demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot editor
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        id: templates
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-windows-templates-4.6.3
      - name: Install Windows export templates
        if: github.event_name != 'pull_request' && steps.templates.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q -j /tmp/templates.tpz 'templates/windows_*' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import, test, validate, and package
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/verify.py
          else
            python tools/verify.py --export-windows
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LastCall-windows-greybox-${{ github.sha }}
          path: build/LastCall-windows-greybox.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-check-logs
          path: build/logs/
